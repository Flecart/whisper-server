[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "whisper-server"
version = "0.1.0"
description = "A lightweight Deepgram-compatible streaming faster-whisper server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{name = "Angelo Huang"}]
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.2,<2",
  "numpy>=1.26,<2.3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12>=12,<13",
  "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
whisper-server = "whisper_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["whisper_server"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true
